# PulseAudio profile set for the Pyra's card on AESS kernels.
#
# Installed to /etc/pulse/pyra-alsa-mixer/profile-sets/ and loaded by
# pyra-aess.pa through module-alsa-card profile_set=.... Its two paths,
# ../paths/pyra-*.conf, go to /usr/share/pulseaudio/alsa-mixer/paths/:
# PulseAudio 17 reads a profile set's paths from there and nowhere else, and
# silently probes a missing one as empty.
# It describes one device, the AESS front end hw:L15,5, with two output
# paths. PulseAudio makes them two ports of the one sink: MATE's Output tab
# shows a connector list, and the Hardware tab shows a card.
#
# Why not UCM: PulseAudio 17 turns UCM devices that share a PCM into
# separate profiles, which moves the speaker/headphone choice into the
# Hardware tab. Tried 2026-10-20.
#
# No skip-probe: with it PulseAudio never loads the mapping's paths, and
# the sink comes up with no ports.

[General]
auto-profiles = no

[Mapping aess]
description = Audio DSP (AESS)
device-strings = hw:%f,5
channel-map = left,right
paths-output = pyra-speaker pyra-headphones
direction = output
priority = 100

[Profile output:aess]
description = Audio DSP (AESS)
output-mappings = aess
priority = 100
