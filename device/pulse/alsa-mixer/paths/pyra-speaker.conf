# The speakers: handsfree routes to the HF DAC, headset routes off.
#
# The output is chosen at the codec. The DSP's DL1 and DL2 mixers stay on
# (fix 9's helper sets them), so hw:L15,5 always has a back end and always
# opens. With a route Off, DAPM powers that amplifier down.
#
# No volume element: the speaker level belongs to pyra_volumed and the
# volume wheel, and PulseAudio uses software volume on top, as before.
#
# Unavailable while headphones are in, so module-switch-on-port-available
# moves to the headphones on plug-in and back on unplug. See
# pyra-headphones.conf for which kernels report the jack correctly.

[General]
description = Speakers
priority = 100
type = speaker

[Jack Headset Stereophone]
state.plugged = no
state.unplugged = unknown

[Element Handsfree Left Playback]
enumeration = select

[Option Handsfree Left Playback:HF DAC]
name = output-speaker

[Element Handsfree Right Playback]
enumeration = select

[Option Handsfree Right Playback:HF DAC]
name = output-speaker

[Element Headset Left Playback]
enumeration = select

[Option Headset Left Playback:Off]
name = output-speaker

[Element Headset Right Playback]
enumeration = select

[Option Headset Right Playback:Off]
name = output-speaker
