# The headphones: headset routes to the HS DAC, handsfree routes off.
#
# Lower priority than the speakers, so a fresh install starts on the
# speakers; module-device-restore keeps whatever is picked after that.
# There is no jack element: the TWL6040's jack switch reads "inserted" with
# the jack empty, so PulseAudio would always choose the headphones.

[General]
description = Headphones
priority = 90
type = headphones

[Element Headset Left Playback]
enumeration = select

[Option Headset Left Playback:HS DAC]
name = output-headphones

[Element Headset Right Playback]
enumeration = select

[Option Headset Right Playback:HS DAC]
name = output-headphones

[Element Handsfree Left Playback]
enumeration = select

[Option Handsfree Left Playback:Off]
name = output-headphones

[Element Handsfree Right Playback]
enumeration = select

[Option Handsfree Right Playback:Off]
name = output-headphones
