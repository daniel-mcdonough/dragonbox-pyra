# The headphones: headset routes to the HS DAC, handsfree routes off.
#
# Lower priority than the speakers, so with nothing plugged in the speakers
# win.
#
# Available only while something is in the jack. The jack control is the
# TS3A227E's, from experiments/jack-detect (0037-0039). On a kernel without
# those it comes from the TWL6040 and reads "inserted" whatever is in the
# jack, so this port would always be available and the speakers never: only
# 5.6.19-m4-kbdled has them, and 5.6.19-m4 has no working speaker path
# anyway (it predates experiments/aess/0036).

[General]
description = Headphones
priority = 90
type = headphones

[Jack Headset Stereophone]
required-any = any

[Element Headset Left Playback]
enumeration = select

[Option Headset Left Playback:HS DAC]
name = output-headphones

[Element Headset Right Playback]
enumeration = select

[Option Headset Right Playback:HS DAC]
name = output-headphones

[Element Handsfree Left Playback]
enumeration = select

[Option Handsfree Left Playback:Off]
name = output-headphones

[Element Handsfree Right Playback]
enumeration = select

[Option Handsfree Right Playback:Off]
name = output-headphones
