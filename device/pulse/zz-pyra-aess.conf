# Point PulseAudio at the AESS script instead of the packaged pyra.pa.
# Read after pyra.conf (alphabetical), so these assignments win.
#
# Right only on an AESS kernel. This copy lives in /usr/local/share/pyra-audio;
# /etc/pulse/daemon.conf.d/zz-pyra-aess.conf is a link into /run, and
# pyra-audio-select.service puts this file at its end at boot when the kernel
# has the AESS front end, and leaves it dangling otherwise. To use the packaged
# configuration on every kernel, disable that service.
default-script-file = /etc/pulse/pyra-aess.pa

# 48 kHz, fixed. The AESS front end advertised 44100 as well and could not
# play it: 44.1 kHz needs the whole engine to change timebase (event counter
# 2048 -> 2228, McPDM 96 -> 88.2 kHz) and nothing in the driver ever asks for
# that, so a 44.1 kHz stream came out 8.84% fast. This file used to set
# avoid-resampling = yes and alternate-sample-rate = 44100, which sent every
# 44.1 kHz file -- most music -- straight down that path. See
# experiments/aess/0029; the kernel no longer offers the rate either.
default-sample-rate = 48000

# Which leaves 44.1 kHz material to be converted here. Not "trivial": that is
# nearest-neighbour, it aliases, and it sounds harsh -- it was inherited from
# the packaged pyra.conf and was in the path for every listening test so far.
# speex-float-1 is clean and costs a few percent of one core; the DSP is still
# saving the other ten or so.
resample-method = speex-float-1
