# Point PulseAudio at the AESS script instead of the packaged pyra.pa.
# Read after pyra.conf (alphabetical), so these assignments win. Delete this
# file to go back to the packaged configuration.
default-script-file = /etc/pulse/pyra-aess.pa

# The AESS front end takes 44100 *or* 48000 S16_LE natively, so let the sink
# follow whatever the application produces instead of converting to a fixed
# rate. Music is overwhelmingly 44100; pinning the sink at 48000 put the
# resampler back in the path and cost 9% of a core against 4% when the rates
# match -- most of what the DSP was brought in to save.
avoid-resampling = yes
default-sample-rate = 48000
alternate-sample-rate = 44100

# Kept from the packaged pyra.conf: if a conversion is ever unavoidable, do the
# cheapest one. The DSP exists so that it usually is avoidable.
resample-method = trivial
