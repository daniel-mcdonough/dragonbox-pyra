# Installed by pc/pyra-trixie-prep.sh (fix 15) and device/pyra-install-helpers.sh.
#
# funkeymonkey-pyrainput 0.1.19 reads /etc/pyrainput.cfg at start and then sets
# the brightness-key commands back to its built-in ones, so the Fn keys only
# reach pyra-kbdlight.sh after a reload (docs/fixes.md, fix 15). This reloads
# once at each start, after waiting for funkeymonkey's SIGUSR1 handler: a USR1
# before it kills the daemon. The leading "-" keeps any failure from failing
# the unit.
[Service]
ExecStartPost=-/usr/local/sbin/pyra-kbdlight.sh --reload $MAINPID
