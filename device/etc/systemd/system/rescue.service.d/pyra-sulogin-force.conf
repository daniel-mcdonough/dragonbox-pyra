# Installed by pc/pyra-trixie-prep.sh (fix 2).
#
# Prep locks root, as the vendor's first-run wizard did (docs/fixes.md, fix 2).
# With root locked, sulogin refuses the emergency and rescue shells ("the root
# account is locked"), so a boot that fails into one would get no further.
# This lets sulogin open a root shell on the console without a password. It
# gives nothing that holding the card doesn't already give.
[Service]
Environment=SYSTEMD_SULOGIN_FORCE=1
