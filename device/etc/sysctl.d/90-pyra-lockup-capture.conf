# Capture settings for the modeset hang. See docs/troubleshooting.md.
#
# The stock sysrq mask is 438, which leaves out 0x8, the debugging dumps.
# That is the bit that makes "echo l" (backtrace every CPU) and "echo w"
# (every blocked task) work, and sysrq is the only instrument that catches
# this particular fault: it is a preemptible busy loop, which the kernel's
# own soft lockup detector cannot see. 446 is 438 with that bit added.
kernel.sysrq = 446

# If the soft lockup detector ever does fire, dump every core rather than
# only the stuck one. The display fault involves a worker on one core and
# the X server on the other.
kernel.softlockup_all_cpu_backtrace = 1
